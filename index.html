<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5dade2" />
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon_x192.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Pikmin Bloom 搜尋字串產生器 [TEST]</title>
</head>

<body>
    <div class="container">
        <h1>Pikmin Bloom 搜尋字串產生器</h1>
        <p>點擊按鈕選擇皮克敏的狀態、種類 (包括顏色、羽翅、岩石) 或標籤，來組合您的 Pikmin Bloom 搜尋字串。完成後複製到遊戲中使用。</p>
        <textarea id="displayTextbox" rows="1" cols="50" readonly></textarea>

        <div class="button-grid">
            <button id="setLeafTextButton" data-text="葉子">葉子</button>
            <button id="setBudTextButton" data-text="花苞">花苞</button>
            <button id="setFlowerTextButton" data-text="開花">開花</button>
            <button id="setFlowerFullTextButton" data-text="花朵">花朵</button>
            <button id="setWitheredTextButton" data-text="枯萎">枯萎</button>
        </div>
        <div class="button-grid">
            <button id="redButton" data-text="紅色">紅色</button>
            <button id="yellowButton" data-text="黃色">黃色</button>
            <button id="blueButton" data-text="藍色">藍色</button>
            <button id="purpleButton" data-text="紫色">紫色</button>
            <button id="whiteButton" data-text="白色">白色</button>
            <button id="wingButton" data-text="羽翅">羽翅</button>
            <button id="rockButton" data-text="岩石">岩石</button>
            <button id="iceButton" data-text="冰凍">冰凍</button>
        </div>
        <div class="button-grid">
            <button id="loveButton" data-text="喜愛">喜愛</button>
            <button id="accessoryButton" data-text="飾品">飾品</button>
            <button id="lessThanFourStarsButton" data-text="-3*">未滿四星</button>
            <button id="fourStarsOrMoreButton" data-text="4-*">四星以上</button>
            <button id="intimacyButton">親密度</button>
        </div>
        <div class="functional-buttons">
            <button id="notButton">不是</button>
            <button id="andButton">並且</button>
            <button id="orButton">或</button>
            <button id="clearButton">清除</button>
        </div>

        <button id="copyButton">複製內容到剪貼簿</button>
    </div>

    <footer>
        <a href="https://github.com/craze429/PikminQueryBuilder" target="_blank" rel="noopener">原始碼 / Source</a>
    </footer>

    <div id="intimacy-modal-overlay" class="modal-overlay" style="display:none;">
        <div id="intimacy-modal" class="modal-panel">
            <h2 class="modal-title">親密度</h2>
            <div id="intimacy-preview" class="modal-preview is-empty">（請輸入數字）</div>
            <div class="modal-keypad">
                <button class="keypad-btn num-btn" data-input="6">6</button>
                <button class="keypad-btn num-btn" data-input="7">7</button>
                <button class="keypad-btn num-btn" data-input="8">8</button>
                <button class="keypad-btn backspace-btn" id="keypad-backspace">⌫</button>
                <button class="keypad-btn num-btn" data-input="3">3</button>
                <button class="keypad-btn num-btn" data-input="4">4</button>
                <button class="keypad-btn num-btn" data-input="5">5</button>
                <div class="keypad-spacer"></div>
                <button class="keypad-btn num-btn" data-input="0">0</button>
                <button class="keypad-btn num-btn" data-input="1">1</button>
                <button class="keypad-btn num-btn" data-input="2">2</button>
                <button class="keypad-btn dash-btn" data-input="-">－</button>
                <button class="keypad-btn cancel-btn" id="keypad-cancel">取消</button>
                <button class="keypad-btn confirm-btn" id="keypad-confirm">確認</button>
            </div>
        </div>
    </div>

    <div id="toast-notification" class="toast" style="display:none;"></div>

    <script src="script.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>

</html>
